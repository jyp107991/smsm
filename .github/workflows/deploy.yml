# Main → checks → database migrations → Edge Functions → build → Cloudflare → smoke test.
# Any failure stops the line. Auth settings are never pushed from here (see auth-config.yml).
name: deploy
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  checks:
    uses: ./.github/workflows/ci.yml
    secrets: inherit

  deploy:
    needs: checks
    # Only main ever deploys, even when started by hand.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
      VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Check secrets and variables are present
        run: bash scripts/check-deploy-settings.sh
      - name: Build
        run: npm run build && npm run build:demo
      - name: Link Supabase project
        run: npx supabase link --project-ref "$SUPABASE_PROJECT_REF" --yes
      - name: Database migrations
        run: |
          npx supabase db push --remote --dry-run --password "$SUPABASE_DB_PASSWORD" --yes
          npx supabase db push --remote --password "$SUPABASE_DB_PASSWORD" --yes
      - name: Edge Functions
        run: |
          if ls -d supabase/functions/*/ >/dev/null 2>&1; then
            npx supabase functions deploy --remote --yes
          else
            echo "No Edge Functions yet."
          fi
      - name: Deploy the app
        run: set -o pipefail; npx wrangler deploy --var "SUPABASE_URL:$VITE_SUPABASE_URL" --var "SUPABASE_KEY:$VITE_SUPABASE_PUBLISHABLE_KEY" 2>&1 | scripts/redact.sh | tee deploy-app.log
      - name: Deploy the demo and gallery
        run: set -o pipefail; npx wrangler deploy -c wrangler.demo.jsonc 2>&1 | scripts/redact.sh | tee deploy-demo.log
      - name: Smoke test
        run: |
          app=$(grep -oE 'https://smsm\.[a-z0-9-]+\.workers\.dev' deploy-app.log | head -1)
          demo=$(grep -oE 'https://smsm-demo\.[a-z0-9-]+\.workers\.dev' deploy-demo.log | head -1)
          bash scripts/smoke.sh "$app" "$GITHUB_SHA"
          echo "### Live" >> "$GITHUB_STEP_SUMMARY"
          echo "- App: $app" >> "$GITHUB_STEP_SUMMARY"
          echo "- Demo and gallery: $demo/gallery" >> "$GITHUB_STEP_SUMMARY"
