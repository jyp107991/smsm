# Checks for every branch push, and the gate that deploy.yml runs before shipping main.
name: ci
on:
  push:
    branches-ignore: [main]
  workflow_call:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'push' }}

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PGHOST: localhost
      PGUSER: postgres
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Unit and property tests
        run: npm test
      - name: Trace (every criterion tested or deferred)
        run: npm run trace
      - name: Database tests (PostgreSQL 16)
        run: npm run test:sql
      - name: Generated schema snapshot and types are up to date
        run: bash scripts/db-generate.sh --check
      - name: Build (app and demo)
        run: npm run build && npm run build:demo
      - name: Production bundle has no gallery or demo data
        run: |
          if grep -rlE 'smsm gallery|DEMO42' dist/; then echo "Demo-only code reached the production build."; exit 1; fi
          echo "Production bundle is clean."
      - name: Install Playwright's Chromium
        run: npx playwright install --with-deps chromium
      - name: End-to-end and accessibility
        run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7
      - uses: actions/upload-artifact@v4
        with:
          name: dist-demo
          path: dist-demo
          retention-days: 7

  # Proves the secrets and variables work before anything reaches main: links the project, lists the
  # migrations a deploy would apply (changes nothing), and checks the Cloudflare token.
  remote-check:
    if: github.event_name == 'push' && github.ref != 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
      VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Secrets and variables present
        run: bash scripts/check-deploy-settings.sh
      - name: Supabase token and project
        run: npx supabase link --project-ref "$SUPABASE_PROJECT_REF" --yes
      - name: Database password (dry run, changes nothing)
        run: npx supabase db push --remote --dry-run --password "$SUPABASE_DB_PASSWORD" --yes
      - name: Cloudflare token (prints only whether it is active; logs are public)
        env:
          TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          status=$(curl -fsS https://api.cloudflare.com/client/v4/user/tokens/verify -H "Authorization: Bearer $TOKEN" \
            | sed -n 's/.*"status":"\([a-z]*\)".*/\1/p')
          echo "Cloudflare token status: ${status:-unknown}"
          [ "$status" = "active" ] || { echo "CLOUDFLARE_API_TOKEN is not active: create a new one (DEPLOY §2) and replace the GitHub secret."; exit 1; }

  # A preview of the demo build for each branch, so interface changes can be seen on a phone before merging.
  preview:
    needs: checks
    if: github.event_name == 'push' && github.ref != 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: dist-demo
          path: dist-demo
      - name: Upload preview version of smsm-demo
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -o pipefail
          alias=$(echo "${GITHUB_REF_NAME}" | tr '[:upper:]' '[:lower:]' | sed 's/[^a-z0-9]/-/g' | cut -c1-30 | sed 's/-*$//')
          if ! npx wrangler versions upload -c wrangler.demo.jsonc --preview-alias "$alias" --message "${GITHUB_SHA::7}" 2>&1 | scripts/redact.sh | tee upload.log; then
            if grep -q 'does not yet exist' upload.log; then
              echo "smsm-demo has not been deployed from main yet; previews start after the first deploy." | tee -a "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            exit 1
          fi
          url=$(grep -oE 'https://[a-z0-9.-]+\.workers\.dev' upload.log | grep -- "$alias" | head -1 || true)
          echo "### Preview" >> "$GITHUB_STEP_SUMMARY"
          echo "${url:-see log}" >> "$GITHUB_STEP_SUMMARY"
