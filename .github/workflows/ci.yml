# Checks for every branch push, and the gate that deploy.yml runs before shipping main.
name: ci
on:
  push:
    branches-ignore: [main]
  workflow_call:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'push' }}

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PGHOST: localhost
      PGUSER: postgres
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Unit and property tests
        run: npm test
      - name: Mutation tests on the money core (score at least 85%)
        run: npm run test:mutation -- --reporters clear-text
      - name: Trace (every criterion tested or deferred)
        run: npm run trace
      - name: Database tests (PostgreSQL 16)
        run: npm run test:sql
      - name: Generated schema snapshot and types are up to date
        run: bash scripts/db-generate.sh --check
      - name: Build (app and demo)
        run: npm run build && npm run build:demo
      - name: Production bundle has no gallery or demo data
        run: |
          if grep -rlE 'smsm gallery|DEMO42' dist/; then echo "Demo-only code reached the production build."; exit 1; fi
          echo "Production bundle is clean."
      - name: Fonts resolve in both builds (the owner's chosen typeface, not a system fallback)
        run: |
          # An unresolved package path (url(@fontsource/...) or /node_modules/...) builds without error but serves
          # index.html instead of the font, so the app silently falls back to system type (QA, 17 Nov).
          if grep -rlE "url\((['\"])?@fontsource|/node_modules/" dist/ dist-demo/ --include='*.css' --include='*.html'; then
            echo "A font path was not resolved by the build."; exit 1
          fi
          for d in dist dist-demo; do
            n=$(ls $d/assets/gowun-*.woff2 2>/dev/null | wc -l)
            [ "$n" -gt 0 ] || { echo "No Gowun font files in $d/assets."; exit 1; }
          done
          echo "Fonts resolve."
      - name: Install Playwright's Chromium
        run: npx playwright install --with-deps chromium
      - name: End-to-end and accessibility
        run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7
      - uses: actions/upload-artifact@v4
        with:
          name: dist-demo
          path: dist-demo
          retention-days: 7

  # The two-user end-to-end suite (docs/slices/S2-ci.md): the production build against the Supabase local
  # stack, two phones with fixed clocks, sign-in codes from the local mail catcher. Nothing here is deployed.
  two-users:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Local sign-in settings for the suite (CI workspace only, never committed)
        run: |
          sed -i -E 's/^(sign_in_sign_ups|token_verifications) = .*/\1 = 1000/' supabase/config.toml
          # The code email templates come from config.toml (as on the live project). The live project sends
          # through Gmail; the local stack must keep its own mail catcher (Mailpit) so the suite can read the
          # codes and nothing is ever sent from the real account. So the SMTP block is removed here, in the
          # CI workspace only.
          awk '/^\[auth\.email\.smtp\]/{skip=1; next} skip && /^(\[|#)/{skip=0} !skip' supabase/config.toml > config.tmp
          mv config.tmp supabase/config.toml
          if grep -q 'auth.email.smtp' supabase/config.toml; then echo "SMTP block still present"; exit 1; fi
          grep -q '^\[auth.email.template.magic_link\]' supabase/config.toml || { echo "code email template missing"; exit 1; }
          git diff --stat supabase/config.toml
      - name: Supabase local stack (applies supabase/migrations)
        run: npx supabase start -x studio,imgproxy,edge-runtime,logflare,vector,supavisor,postgres-meta
      - name: Stack addresses and keys for the tests and the app build
        run: |
          # `status -o env` prints NAME="value"; GITHUB_ENV wants NAME=value. The local stack's keys are its
          # fixed development keys, but are masked anyway because logs are public.
          npx supabase status -o env | sed -E 's/^([A-Z_]+)="(.*)"$/\1=\2/' > stack.env
          while IFS='=' read -r name value; do
            case "$name" in *KEY*|*SECRET*) echo "::add-mask::$value";; esac
            echo "$name=$value" >> "$GITHUB_ENV"
          done < stack.env
          rm stack.env
      - name: App build points at the local stack
        run: |
          echo "VITE_SUPABASE_URL=$API_URL" >> "$GITHUB_ENV"
          echo "VITE_SUPABASE_PUBLISHABLE_KEY=$PUBLISHABLE_KEY" >> "$GITHUB_ENV"
      - name: Install Playwright's Chromium
        run: npx playwright install --with-deps chromium
      - name: Two-user end-to-end (two phones, fixed clock, real database)
        run: npx playwright test -c tests/e2e/two-users/playwright.config.ts
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report-two-users
          path: |
            playwright-report/two-users
            test-results/two-users
          retention-days: 7
      - name: Stop the stack
        if: always()
        run: npx supabase stop --no-backup

  # Proves the secrets and variables work before anything reaches main: links the project, lists the
  # migrations a deploy would apply (changes nothing), and checks the Cloudflare token.
  remote-check:
    if: github.event_name == 'push' && github.ref != 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
      VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Secrets and variables present
        run: bash scripts/check-deploy-settings.sh
      - name: Supabase token and project
        run: npx supabase link --project-ref "$SUPABASE_PROJECT_REF" --yes
      - name: Database password (dry run, changes nothing)
        run: npx supabase db push --remote --dry-run --password "$SUPABASE_DB_PASSWORD" --yes
      - name: Cloudflare token (prints only whether it is active; logs are public)
        env:
          TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          status=$(curl -fsS https://api.cloudflare.com/client/v4/user/tokens/verify -H "Authorization: Bearer $TOKEN" \
            | sed -n 's/.*"status":"\([a-z]*\)".*/\1/p')
          echo "Cloudflare token status: ${status:-unknown}"
          [ "$status" = "active" ] || { echo "CLOUDFLARE_API_TOKEN is not active: create a new one (DEPLOY §2) and replace the GitHub secret."; exit 1; }

  # A preview of the demo build for each branch, so interface changes can be seen on a phone before merging.
  preview:
    needs: checks
    if: github.event_name == 'push' && github.ref != 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: dist-demo
          path: dist-demo
      - name: Upload preview version of smsm-demo
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -o pipefail
          alias=$(echo "${GITHUB_REF_NAME}" | tr '[:upper:]' '[:lower:]' | sed 's/[^a-z0-9]/-/g' | cut -c1-30 | sed 's/-*$//')
          if ! npx wrangler versions upload -c wrangler.demo.jsonc --preview-alias "$alias" --message "${GITHUB_SHA::7}" 2>&1 | scripts/redact.sh | tee upload.log; then
            if grep -q 'does not yet exist' upload.log; then
              echo "smsm-demo has not been deployed from main yet; previews start after the first deploy." | tee -a "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            exit 1
          fi
          url=$(grep -oE 'https://[a-z0-9.-]+\.workers\.dev' upload.log | grep -- "$alias" | head -1 || true)
          echo "### Preview" >> "$GITHUB_STEP_SUMMARY"
          echo "${url:-see log}" >> "$GITHUB_STEP_SUMMARY"
