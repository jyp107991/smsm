# The live eval of the smart features (docs/AI.md §5), run by hand: Actions → eval-ai → Run workflow.
# Calls Cloudflare Workers AI with the repository's existing Cloudflare token (it needs "Workers AI: Read").
# Results go to the job summary (and tests/ai/eval/last-run.md in the run, not committed).
name: eval-ai
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  eval:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run eval:ai
