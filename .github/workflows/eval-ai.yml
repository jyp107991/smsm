# The live eval of the smart features (docs/AI.md §5), run by hand: Actions → eval-ai → Run workflow.
# Calls Cloudflare Workers AI with the repository's existing Cloudflare token (it needs "Workers AI: Read").
# Results go to the job summary (and tests/ai/eval/last-run.md in the run, not committed).
# By default it sends a small stratified sample (tests/ai/eval/plan.ts). The free Workers AI allocation (10,000 Neurons a
# day) is shared with the live app and MacroPy: tick "full" only on a quiet day (docs/AI.md §5). A run stops at the first
# "daily free allocation used up" answer.
name: eval-ai
on:
  workflow_dispatch:
    inputs:
      full:
        description: 'Send every case (uses most of the day’s free AI allowance; quiet days only)'
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  eval:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      EVAL_FULL: ${{ inputs.full }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run eval:ai
