# Sign-in settings live in supabase/config.toml. This workflow only runs by hand.
#   mode=diff (default): shows exactly what a push would change on the live project. Read-only.
#   mode=push: applies them. Only after the owner has approved the diff (DEPLOY §1).
name: auth-config
on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'diff (read-only) or push (owner approved)'
        type: choice
        options: [diff, push]
        default: diff

permissions:
  contents: read

jobs:
  config:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
      SUPABASE_SMTP_USER: ${{ secrets.SUPABASE_SMTP_USER }}
      SUPABASE_SMTP_PASS: ${{ secrets.SUPABASE_SMTP_PASS }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx supabase link --project-ref "$SUPABASE_PROJECT_REF" --yes
      - name: Diff (read-only; emails hidden because logs are public)
        run: set -o pipefail; npx supabase config diff 2>&1 | scripts/redact.sh
      - name: Push
        if: inputs.mode == 'push'
        run: |
          set -o pipefail
          if grep -q '^\[auth.email.smtp\]' supabase/config.toml && { [ -z "$SUPABASE_SMTP_USER" ] || [ -z "$SUPABASE_SMTP_PASS" ]; }; then
            echo "SMTP is configured but SUPABASE_SMTP_USER or SUPABASE_SMTP_PASS is not set as a GitHub secret. Not pushing."; exit 1
          fi
          npx supabase config push --yes 2>&1 | scripts/redact.sh
      - name: Live sign-in emails carry the 6-digit code (prints yes/no only)
        run: |
          set -euo pipefail
          curl -sf -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
            "https://api.supabase.com/v1/projects/$SUPABASE_PROJECT_REF/config/auth" > auth.json
          python3 - <<'PY'
          import json
          c = json.load(open('auth.json'))
          ok = True
          for kind in ('magic_link', 'confirmation'):
              body = c.get(f'mailer_templates_{kind}_content') or ''
              has = '{{ .Token }}' in body
              ok = ok and has
              print(f"{kind}: subject {c.get(f'mailer_subjects_{kind}')!r}; contains the code: {'yes' if has else 'NO'}")
          print('custom sender on:', 'yes' if c.get('smtp_host') else 'no')
          raise SystemExit(0 if ok else 1)
          PY
          rm -f auth.json
