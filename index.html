<!doctype html>
<html lang="en-GB">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#DCDFCD" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#1D221A" />
    <meta name="description" content="A home ledger for two" />
    <!-- The default typeface's Latin files that the first screen uses (src/styles/type.css), fetched before the CSS asks for them; Gowun Batang 700 joins them when Home shows the balance. Vite rewrites each path to the hashed asset the CSS uses. Korean files are never preloaded. -->
    <link rel="preload" as="font" type="font/woff2" crossorigin href="/node_modules/@fontsource/gowun-dodum/files/gowun-dodum-latin-400-normal.woff2" />
    <link rel="preload" as="font" type="font/woff2" crossorigin href="/node_modules/@fontsource/gowun-batang/files/gowun-batang-latin-400-normal.woff2" />
    <link rel="icon" href="/icons/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/icons/icon-192.png" />
    <title>smsm</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
