# Supabase settings as code (DEPLOY §1). The CLI (v3) pushes only what this file declares; anything not
# declared is left as it is on the live project. Auth settings are pushed by hand only, through
# .github/workflows/auth-config.yml, after the owner has approved the diff it prints.
# This repository is public: nothing personal goes in this file. The sender address and password come
# from the GitHub secrets SUPABASE_SMTP_USER and SUPABASE_SMTP_PASS.
project_id = "smsm"

[auth]
enabled = true
# The app's address. Sign-in uses 6-digit codes, so no redirect links are needed.
site_url = "https://smsm.jaexpark94.workers.dev"
additional_redirect_urls = []
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
# Off since both people joined (owner, 17 Nov). To let someone new sign up again (e.g. a new phone with a new
# email), set this to true and push it through auth-config.yml with the owner's approval.
enable_signup = false
enable_anonymous_sign_ins = false
enable_manual_linking = false

[auth.rate_limit]
email_sent = 30
sign_in_sign_ups = 30
token_verifications = 30
token_refresh = 150

[auth.email]
enabled = true
enable_confirmations = false
double_confirm_changes = true
secure_password_change = true
max_frequency = "60s"
otp_length = 6
otp_expiry = 900

# Sign-in codes are sent from smsm's own Gmail account (owner's choice, 17 Nov). The address and its app
# password live only in the GitHub secrets SUPABASE_SMTP_USER and SUPABASE_SMTP_PASS.
[auth.email.smtp]
enabled = true
host = "smtp.gmail.com"
port = 587
user = "env(SUPABASE_SMTP_USER)"
pass = "env(SUPABASE_SMTP_PASS)"
admin_email = "env(SUPABASE_SMTP_USER)"
sender_name = "smsm"

# A new person's first code and a returning person's code use the same email: the 6-digit code.
[auth.email.template.magic_link]
subject = "Your smsm code"
content_path = "./supabase/templates/code.html"

[auth.email.template.confirmation]
subject = "Your smsm code"
content_path = "./supabase/templates/code.html"

[auth.sms]
enabled = false

[auth.mfa]
max_enrolled_factors = 10

# S8: the push function is called by the database (pg_net) with the database's own token, which the function
# checks itself, so the gateway's JWT check is off for it. It holds no secret of its own.
[functions.push]
enabled = true
verify_jwt = false
